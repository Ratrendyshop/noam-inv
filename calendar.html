<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>הוספה ליומן – העלייה לתורה של נועם</title>
<meta property="og:type" content="website">
<meta property="og:image" content="https://noam-inv.netlify.app/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F8F5EF">
<script>
/* =====================================================================
   פרטי האירוע ליומן — לשינוי שעות/כותרת משנים כאן
   (ואם משנים, מעדכנים גם את הקובץ noam-aliyah.ics — Claude יכול לייצר אותו מחדש).
   ===================================================================== */
const EVENT = {
  title: "העלייה לתורה של נועם אביבי",
  date: "20261022",          // YYYYMMDD
  start: "093000",           // HHMMSS, שעון ישראל
  end: "120000",             // HHMMSS, שעון ישראל
  timezone: "Asia/Jerusalem",
  location: "רחוב המייסדים 34, מושב כפר אחים",
  details: "בשעה 09:30 ניפגש בביתנו, ומשם נלווה את חתן בר המצווה לבית הכנסת לעלייה לתורה.\nונמשיך לארוחת בוקר חגיגית בביתנו.\n\nההזמנה, ניווט ואישור הגעה:\nhttps://noam-inv.netlify.app/",
  icsFile: "noam-aliyah.ics"
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Noto+Serif+Hebrew:wdth,wght@62.5..100,400..900&display=swap">
<style>
:root { --cream:#F8F5EF; --gold:#B69A62; --gold-soft:#D6C39A; --slate:#394852; --ink:#1D3040; --ground:#EAE3D6; }
[hidden] { display:none !important; }
body {
  margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center;
  background:var(--ground); background-image:radial-gradient(120% 70% at 50% 0%, #F3EEE5 0%, var(--ground) 70%);
  color:var(--ink); font-family:"Assistant", Arial, sans-serif; -webkit-font-smoothing:antialiased;
}
.wrap { box-sizing:border-box; width:100%; padding:24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); display:flex; justify-content:center; }
.card {
  position:relative; box-sizing:border-box; width:min(100%, 420px); padding:44px 26px 30px; text-align:center;
  background:var(--cream); border:1.5px solid var(--gold); border-radius:4px;
  box-shadow: inset 0 0 0 6px var(--cream), inset 0 0 0 7px var(--gold-soft), 0 30px 60px -30px rgba(29,48,64,.45);
}
.cn { position:absolute; width:16px; height:16px; color:var(--gold); }
.cn.tr { top:14px; right:14px; } .cn.tl { top:14px; left:14px; transform:scaleX(-1); }
.cn.br { bottom:14px; right:14px; transform:scaleY(-1); } .cn.bl { bottom:14px; left:14px; transform:scale(-1,-1); }
.eyebrow { margin:0 0 4px; font-size:14px; font-weight:600; letter-spacing:.12em; color:#86693A; }
h1 { margin:0; text-wrap:balance; font-family:"Noto Serif Hebrew", serif; font-weight:780; font-stretch:80%; font-size:40px; line-height:1.15; }
.when { margin:10px 0 0; font-size:17px; color:var(--slate); }
.rule { width:64px; height:1px; margin:20px auto 22px; background:var(--gold); }
.btns { display:grid; gap:12px; }
.btn {
  display:flex; align-items:center; justify-content:center; gap:10px; box-sizing:border-box; min-height:54px; padding:0 18px;
  border:1.5px solid var(--gold); border-radius:10px; background:var(--cream); color:var(--ink);
  font:700 17px/1.2 "Assistant", Arial, sans-serif; letter-spacing:.03em; text-decoration:none;
  transition:background-color .25s, box-shadow .25s; -webkit-tap-highlight-color:transparent;
}
.btn.primary { box-shadow: inset 0 0 0 4px var(--cream), inset 0 0 0 5px var(--gold-soft); }
.btn:hover { background:#F3EDE1; }
.btn:active { background:#EDE4D2; }
.btn:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
.btn svg { width:20px; height:20px; color:var(--gold); flex:none; }
.note { margin:16px 0 0; font-size:14px; line-height:1.5; color:var(--slate); }
.back { display:inline-block; margin-top:18px; font-size:15px; color:var(--slate); }
.back:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <main class="card">
    <svg class="cn tr" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="1" width="14" height="14"/><path d="M15 1L1 15"/></svg>
    <svg class="cn tl" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="1" width="14" height="14"/><path d="M15 1L1 15"/></svg>
    <svg class="cn br" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="1" width="14" height="14"/><path d="M15 1L1 15"/></svg>
    <svg class="cn bl" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="1" y="1" width="14" height="14"/><path d="M15 1L1 15"/></svg>

    <p class="eyebrow">הוספה ליומן</p>
    <h1>העלייה לתורה של נועם</h1>
    <p class="when">יום חמישי, י״א בחשוון תשפ״ז<br>22.10.2026 · בשעה 09:30</p>
    <div class="rule" aria-hidden="true"></div>

    <div class="btns" id="btns">
      <a class="btn" id="appleBtn" href="noam-aliyah.ics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
        <span>יומן אייפון / Mac</span>
      </a>
      <a class="btn" id="googleBtn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4M9 15h6M12 12v6"/></svg>
        <span>Google Calendar</span>
      </a>
    </div>
    <p class="note">אאוטלוק או יומן אחר? הכפתור "יומן אייפון / Mac" מוריד קובץ יומן שמתאים לכל תוכנת יומן.</p>
    <a class="back" href="./">חזרה להזמנה</a>
  </main>
</div>

<script>
(() => {
  const E = EVENT;
  const google = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(E.title) +
    "&dates=" + E.date + "T" + E.start + "/" + E.date + "T" + E.end +
    "&ctz=" + encodeURIComponent(E.timezone) +
    "&location=" + encodeURIComponent(E.location) +
    "&details=" + encodeURIComponent(E.details);

  const appleBtn = document.getElementById("appleBtn");
  const googleBtn = document.getElementById("googleBtn");
  appleBtn.href = E.icsFile;
  googleBtn.href = google;

  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/.test(ua);

  // The button that fits this phone goes first and gets the double gold rule.
  const first = isAndroid ? googleBtn : appleBtn;
  first.classList.add("primary");
  first.parentElement.prepend(first);

  // One automatic jump per visit, so the back button never loops.
  let tried = true;
  try { tried = sessionStorage.getItem("calTried") === "1"; sessionStorage.setItem("calTried", "1"); } catch (_) {}
  if (!tried && (isIOS || isAndroid)) {
    setTimeout(() => { location.href = isIOS ? E.icsFile : google; }, 250);
  }
})();
</script>
</body>
</html>
